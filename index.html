<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지구가 1℃씩 오르면 우리는 무엇을 마주할까요?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#2eff2e;--y:#ffd600;--r:#ff3b30;--bg:#0a0a0a}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden;transition:background 1.2s}
.screen{display:none;min-height:100vh;padding:24px 16px;max-width:980px;margin:0 auto;animation:fade .6s}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--g);color:#000;border:0;border-radius:12px;padding:16px 28px;font-size:1.05rem;font-weight:800;transition:.2s}
.btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 0 24px rgba(46,255,46,.5)}
.btn:disabled{background:#333;color:#777;cursor:not-allowed}
.btn.ghost{background:transparent;color:#fff;border:1px solid #555}
/* intro */
#s1{text-align:center;padding-top:6vh}
.tag{color:var(--g);letter-spacing:.3em;font-size:.8rem;font-weight:700}
h1{font-size:clamp(1.9rem,6vw,3.3rem);line-height:1.3;margin:18px 0 10px;font-weight:900}
h1 em{font-style:normal;color:var(--r);text-shadow:0 0 20px rgba(255,59,48,.6)}
.sub{color:#999;margin-bottom:28px}
.chars{display:flex;gap:18px;justify-content:center;margin-bottom:24px}
.card{width:150px;padding:16px 10px 10px;background:#141414;border:2px solid #2a2a2a;border-radius:16px;color:#fff;transition:.2s}
.card svg{width:100%;height:170px}
.card:hover{border-color:#666;transform:translateY(-4px)}
.card.sel{border-color:var(--g);box-shadow:0 0 22px rgba(46,255,46,.4);background:#0d1f0d}
input[type=text]{width:100%;max-width:340px;padding:14px;border-radius:10px;border:2px solid #333;background:#141414;color:#fff;font-size:1rem;text-align:center;margin-bottom:22px;outline:0;font-family:inherit}
input:focus{border-color:var(--g)}
/* briefing */
#s2.on{display:flex;align-items:center;justify-content:center}
.warn{border:2px solid var(--y);border-radius:16px;padding:28px;background:#1a1600;box-shadow:0 0 30px rgba(255,214,0,.2);max-width:720px}
.warn h2{color:var(--y);margin-bottom:16px}
.warn p{line-height:1.9;font-size:1.1rem;min-height:11em}
.warn b{color:var(--r)}.warn i{color:var(--y)}
/* experience */
#s3{padding-bottom:150px}
.dash{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.88);backdrop-filter:blur(6px);padding:10px 12px;border-radius:12px;margin-bottom:12px;border:1px solid #333}
.dash .who{font-size:.9rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.dash .who span:first-child{display:flex;align-items:center;gap:8px}
.mini svg{width:30px;height:30px;display:block}
.gauge{display:flex;gap:4px}
.gauge span{flex:1;height:24px;border-radius:5px;background:#222;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;color:#555;transition:.5s}
.gauge span.on{color:#000}
h2.st{font-size:clamp(1.5rem,5vw,2.2rem);margin-bottom:2px}
.sdesc{color:#bbb;margin-bottom:10px}
.mech{display:none;background:#000;border:1px solid #333;border-radius:12px;padding:10px;text-align:center;margin-bottom:10px;line-height:1.7;font-size:.9rem}
.mech small{color:#f9a8d4;display:block}
.mech .a{color:var(--r);font-weight:800}.mech .b{color:var(--g);font-weight:800}
.scene{position:relative;width:100%;aspect-ratio:900/420;border-radius:16px;overflow:hidden;border:1px solid #333;margin-bottom:12px;background:#000}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.walker{position:absolute;bottom:1.5%;width:8.5%;transform:translateX(-50%);transition:left 1.1s ease-in-out;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.walker svg{width:100%;display:block}
.walker.go svg{animation:bobw2 .3s infinite alternate}
@keyframes bobw2{to{transform:translateY(-6px)}}
.vg{cursor:pointer}
.vg .pinc{animation:pulseP 1.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulseP{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.vg.act .pinc{animation:none;fill:#2eff2e}
.vg:hover .lbl{opacity:1}
/* svg effects */
.fx{transform-box:fill-box;transition:transform 2.4s ease,opacity 2.4s ease,fill 2.4s ease}
.act .melt{transform:scale(.3,.45)}
.act .rise{transform:translateY(-42px)}
.act .rise2{transform:translateY(-100px)}
.act .slide{transform:translateX(34px)}
.act .sink{transform:translateY(46px)}
.act .lower{transform:translateY(16px)}
.act .shrinkx{transform:scaleX(.25)}
.act .grow{transform:scale(1.35)}
.act .dead{fill:#6b4a22}
.act .fadeOut{opacity:.05}
.fadeIn{opacity:0}
.act .fadeIn{opacity:1}
.ecg2{opacity:0}.act .ecg2{opacity:1}.act .ecg1{opacity:0}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rain line{animation:rain .6s linear infinite}
@keyframes rain{from{transform:translateY(-20px)}to{transform:translateY(24px)}}
.bob{animation:bobv 2.2s ease-in-out infinite alternate}
@keyframes bobv{to{transform:translateY(-7px)}}
.drip{animation:drip 1.3s infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(28px);opacity:0}}
.smoke{animation:up 3s infinite}
@keyframes up{from{transform:translateY(0);opacity:.7}to{transform:translateY(-70px);opacity:0}}
.ash{animation:ash 4s linear infinite}
@keyframes ash{from{transform:translateY(-30px);opacity:.8}to{transform:translateY(200px);opacity:0}}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .12s infinite alternate}
@keyframes flap{to{transform:scaleY(.4)}}
.trek{animation:trek 6s linear infinite}
@keyframes trek{from{transform:translateX(-50px)}to{transform:translateX(70px)}}
.pulse{animation:pls 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pls{to{transform:scale(1.15);opacity:.5}}
.wave{animation:wv 3s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(-14px)}}
.info{background:#141414;border-left:5px solid var(--y);border-radius:10px;padding:14px;min-height:78px;line-height:1.6}
.info h3{margin-bottom:8px;color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:#222;border:1px solid #444;border-radius:20px;padding:6px 12px;font-size:.88rem}
.chips span b{color:var(--r)}
.next{margin-top:14px;text-align:center}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:flex-end;gap:12px;padding:8px 16px;background:linear-gradient(transparent,#000 45%);max-width:980px;margin:0 auto}
.dock .av{width:78px;flex:none}
.dock .av svg{width:100%;display:block}
.dock .av small{display:block;text-align:center;font-size:.72rem;color:#aaa}
.bubble{background:#fff;color:#111;border-radius:14px;padding:11px 16px;font-weight:600;line-height:1.5;max-width:560px;position:relative;font-size:.95rem;margin-bottom:14px}
.bubble:before{content:'';position:absolute;left:-10px;bottom:16px;border:6px solid transparent;border-right-color:#fff}
/* report */
.cert{border:3px double var(--g);border-radius:16px;padding:22px 20px;background:linear-gradient(160deg,#0d140d,#1a0a0a);text-align:center}
.cert .cav svg{width:90px;height:110px}
.cert h2{font-size:1.4rem;margin:8px 0}
.cert .tl{text-align:left;margin:16px auto;max-width:560px;font-size:.92rem;line-height:1.6}
.cert .tl div{padding:6px 0;border-bottom:1px solid #2a2a2a}
.cert .tl b{margin-right:8px}
.pledges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.pledges button{background:#141414;border:1px solid #444;color:#fff;border-radius:20px;padding:8px 14px;font-size:.85rem}
.pledges button.sel{border-color:var(--g);background:#0d2a0d}
.pledge-in{max-width:440px!important;margin-bottom:0!important}
.pl{color:var(--y);font-weight:800;margin-top:8px;min-height:1.5em}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--g);color:#000;font-weight:800;padding:12px 22px;border-radius:30px;transition:.4s;z-index:99}
#toast.on{transform:translateX(-50%)}
.foot{color:#777;font-size:.75rem;text-align:center;margin-top:12px}
</style>
</head>
<body>

<section class="screen on" id="s1">
  <div class="tag">CLIMATE TIME TRAVEL</div>
  <h1>지구가 <em>1℃씩</em> 오르면<br>우리는 무엇을 마주할까요?</h1>
  <p class="sub">함께할 캐릭터를 고르고 이름을 입력해 주세요.</p>
  <div class="chars">
    <button class="card" data-g="f" aria-label="캐릭터 1" id="cf"></button>
    <button class="card" data-g="m" aria-label="캐릭터 2" id="cm"></button>
  </div>
  <input type="text" id="name" maxlength="10" placeholder="당신의 이름을 입력해주세요"><br>
  <button class="btn" id="start" disabled>체험 시작하기</button>
</section>

<section class="screen" id="s2">
  <div class="warn">
    <h2>⚠️ 체험 전 안내</h2>
    <p id="typed"></p>
    <div style="text-align:center;margin-top:10px"><button class="btn" id="enter" style="display:none">+1℃의 세계로 입장하기</button></div>
  </div>
</section>

<section class="screen" id="s3">
  <div class="dash">
    <div class="who"><span id="whoLabel"></span><span id="tempLabel" style="font-weight:800"></span></div>
    <div class="gauge" id="gauge"></div>
  </div>
  <h2 class="st" id="stTitle"></h2>
  <p class="sdesc" id="stDesc"></p>
  <div class="mech" id="mech"><span class="a">기후위기</span>는 이미 시작되었습니다.<br>지구가 뜨거워질수록 <span class="b">폭풍·폭우·홍수 같은 극단적 재해</span>가 더 강해지고, 더 자주 일어납니다.</div>
  <div class="scene" id="scene"><svg id="svg" viewBox="0 0 900 420" preserveAspectRatio="xMidYMid slice"></svg><div class="walker" id="walker"></div></div>
  <div class="info" id="info"></div>
  <div class="next"><button class="btn" id="next" disabled>다음 온도로 이동</button></div>
  <div class="dock"><div class="av" id="av"></div><div class="bubble" id="bubble"></div></div>
</section>

<section class="screen" id="s4">
  <div class="cert" id="cert">
    <div class="tag">CERTIFICATE OF WITNESS</div>
    <div class="cav" id="cav"></div>
    <h2 id="ctitle"></h2>
    <div class="tl" id="tl"></div>
    <div>나의 다짐</div>
    <div class="pl" id="pl">아래에서 다짐을 선택하거나 직접 적어 주세요.</div>
    <div class="foot">※ 탄소 감축이 이뤄지지 않았을 때를 가정한 가상 체험 · 《최종 경고: 6도의 멸종》 기반</div>
  </div>
  <div class="pledges" id="pledges"></div>
  <div style="text-align:center"><input type="text" class="pledge-in" id="pin" maxlength="40" placeholder="나만의 다짐을 직접 입력"></div>
  <div class="actions">
    <button class="btn" id="share">📤 공유하기</button>
    <button class="btn ghost" id="copy">🔗 결과 텍스트 복사</button>
    <button class="btn ghost" id="save">🖼️ 인증 이미지 저장</button>
    <button class="btn ghost" id="again">↺ 처음부터 다시 체험하기</button>
  </div>
</section>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 캐릭터 (SVG) ---------- */
function avatar(g,mood='calm',view='full'){
  const hairC=g==='f'?'#5a3a22':'#2b2118';
  const back=g==='f'?`<path d="M-27 36 Q-30 4 0 5 Q30 4 27 36 L30 76 L-30 76Z" fill="${hairC}"/>`:'';
  const body=g==='f'
   ?`<path d="M-16 54 L16 54 L28 114 L-28 114Z" fill="#ff6fa5"/><rect x="-10" y="114" width="7" height="24" fill="#f5c9a0"/><rect x="3" y="114" width="7" height="24" fill="#f5c9a0"/><rect x="-12" y="136" width="11" height="6" rx="3" fill="#7a2e4d"/><rect x="1" y="136" width="11" height="6" rx="3" fill="#7a2e4d"/><rect x="-24" y="58" width="8" height="34" rx="4" fill="#f5c9a0"/><rect x="16" y="58" width="8" height="34" rx="4" fill="#f5c9a0"/>`
   :`<rect x="-17" y="54" width="34" height="38" rx="6" fill="#3b82f6"/><rect x="-17" y="90" width="15" height="48" fill="#374151"/><rect x="2" y="90" width="15" height="48" fill="#374151"/><rect x="-19" y="136" width="18" height="7" rx="3" fill="#111"/><rect x="1" y="136" width="18" height="7" rx="3" fill="#111"/><rect x="-26" y="58" width="9" height="34" rx="4" fill="#f5c9a0"/><rect x="17" y="58" width="9" height="34" rx="4" fill="#f5c9a0"/>`;
  const fringe=g==='f'
   ?`<path d="M-22 30 Q-18 6 4 8 Q22 10 22 30 Q8 16 -22 30Z" fill="${hairC}"/>`
   :`<path d="M-23 30 Q-24 5 0 7 Q24 5 23 30 Q10 15 -23 30Z" fill="${hairC}"/>`;
  let face='';
  const eye=(x,big)=>big?`<circle cx="${x}" cy="33" r="5" fill="#fff"/><circle cx="${x}" cy="33" r="2.2" fill="#222"/>`:`<circle cx="${x}" cy="33" r="2.6" fill="#222"/>`;
  if(mood==='calm')face=eye(-8)+eye(8)+`<path d="M-7 43 Q0 49 7 43" stroke="#a33" fill="none" stroke-width="2" stroke-linecap="round"/>`;
  if(mood==='worry')face=eye(-8)+eye(8)+`<path d="M-13 25 L-4 28 M13 25 L4 28" stroke="#222" stroke-width="2"/><path d="M-6 46 Q0 41 6 46" stroke="#a33" fill="none" stroke-width="2" stroke-linecap="round"/>`;
  if(mood==='shock')face=eye(-8,1)+eye(8,1)+`<path d="M-14 23 L-4 25 M14 23 L4 25" stroke="#222" stroke-width="2"/><ellipse cx="0" cy="45" rx="4" ry="5.5" fill="#733"/>`;
  if(mood==='sad')face=eye(-8)+eye(8)+`<path d="M-13 26 L-4 29 M13 26 L4 29" stroke="#222" stroke-width="2"/><path d="M-6 47 Q0 41 6 47" stroke="#a33" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M-9 38 q-2 5 0 7 q2 -2 0 -7Z M9 38 q-2 5 0 7 q2 -2 0 -7Z" fill="#6cf"/>`;
  const vb=view==='full'?'-40 0 80 146':'-34 0 68 80';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${back}${body}<circle cx="0" cy="32" r="22" fill="#f5c9a0"/>${fringe}${face}</svg>`;
}

/* ---------- 장면 일러스트 ---------- */
const house=(x,y,c='#c9b79c')=>`<rect x="${x}" y="${y}" width="36" height="28" fill="${c}"/><path d="M${x-4} ${y} L${x+18} ${y-18} L${x+40} ${y}Z" fill="#7a2e2e"/><rect x="${x+13}" y="${y+10}" width="9" height="18" fill="#432"/>`;
const arr=(n,f)=>[...Array(n)].map((_,i)=>f(i)).join('');
const person=(x,y,c='#222')=>`<circle cx="${x}" cy="${y-24}" r="5" fill="${c}"/><rect x="${x-4}" y="${y-19}" width="8" height="16" rx="3" fill="${c}"/><rect x="${x-4}" y="${y-3}" width="3" height="9" fill="${c}"/><rect x="${x+1}" y="${y-3}" width="3" height="9" fill="${c}"/>`;
const palm=(x,h)=>`<path d="M${x} 340 Q${x+6} ${340-h/2} ${x-4} ${340-h}" stroke="#6b4a22" stroke-width="6" fill="none"/><path d="M${x-4} ${340-h} q-26 -2 -34 14 M${x-4} ${340-h} q4 -24 32 -14 M${x-4} ${340-h} q24 6 28 26 M${x-4} ${340-h} q-18 8 -20 26" stroke="#2f8f3a" stroke-width="6" fill="none" stroke-linecap="round"/>`;
const skeleton=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})" stroke="#e9e1cf" stroke-width="2" fill="none"><path d="M-22 0 Q0 -14 22 0 Q0 14 -22 0Z"/><path d="M22 0 L34 -9 L34 9Z"/><path d="M-12 -7 V7 M-4 -9 V9 M4 -9 V9 M12 -7 V7"/><circle cx="-14" cy="-2" r="2" fill="#e9e1cf"/></g>`;

const VIG={
 cyclone:()=>`<rect x="-130" y="305" width="260" height="40" fill="#1f5f8b"/><path class="wave" d="M-140 312 q15 -8 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#9fd3f2" stroke-width="3" fill="none"/>
  <g class="rain" stroke="#a9d3ee" stroke-width="2" opacity=".85">${arr(10,i=>`<line x1="${-120+i*26}" y1="${120+(i%3)*14}" x2="${-126+i*26}" y2="${142+(i%3)*14}"/>`)}</g>
  <g class="spin"><path d="M0 170 m-80 0 a80 34 0 1 1 80 34 a56 24 0 1 1 -48 -34 a32 14 0 1 1 34 14" fill="none" stroke="#e8eef2" stroke-width="10" stroke-linecap="round"/><circle cx="0" cy="170" r="9" fill="#111"/></g>
  ${palm(-90,60)}${house(40,312)}`,
 africa:()=>`<path class="fx slide" d="M-130 340 L-130 220 Q-95 195 -50 255 L-30 340Z" fill="#7a5a36"/><path class="fx slide" d="M-100 330 l8 -8 l8 8 M-70 300 l8 -8 l8 8" stroke="#4a3520" stroke-width="3" fill="none"/>
  ${house(-14,312)}${house(34,312,'#d9c9a8')}${house(82,312)}
  <g class="fx rise"><rect x="-140" y="318" width="280" height="130" fill="#3b86b8" opacity=".78"/><path class="wave" d="M-150 318 q15 -8 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#bfe3f7" stroke-width="3" fill="none"/></g>`,
 trash:()=>`${arr(5,i=>`<rect x="${-125+i*54}" y="${190-(i%3)*30}" width="42" height="${150+(i%3)*30}" fill="#3a3f47"/>${arr(3,j=>`<rect x="${-118+i*54+j*12}" y="${205-(i%3)*30+j*0}" width="6" height="8" fill="#ffd66b"/>`)}`)}
  <g class="fx rise"><rect x="-140" y="305" width="280" height="130" fill="#4a7f9a" opacity=".85"/>
  ${arr(9,i=>`<g class="bob" style="animation-delay:${i*.25}s"><rect x="${-120+i*28}" y="${298+(i%2)*4}" width="8" height="18" rx="2" fill="${['#58d','#e55','#fff'][i%3]}" transform="rotate(${i*40} ${-116+i*28} 307)"/></g>`)}
  ${arr(6,i=>`<ellipse class="bob" cx="${-105+i*42}" cy="${312-(i%2)*5}" rx="11" ry="6" fill="#eee" style="animation-delay:${i*.3}s"/>`)}</g>`,
 polar:()=>`<rect x="-130" y="300" width="260" height="46" fill="#1c5d8f"/><path d="M-120 300 L-100 270 L-85 300Z" fill="#cfeaf7" opacity=".6"/>
  <g class="fx melt" style="transform-origin:50% 100%"><path d="M-112 305 L-82 280 L62 278 L112 305Z" fill="#f2fbff"/></g>
  <g class="fx lower"><ellipse cx="-8" cy="264" rx="30" ry="16" fill="#fff"/><circle cx="26" cy="252" r="11" fill="#fff"/><circle cx="31" cy="251" r="1.8" fill="#111"/><circle cx="37" cy="255" r="2.6" fill="#222"/><circle cx="22" cy="243" r="3.5" fill="#fff"/><rect x="-28" y="272" width="8" height="12" fill="#fff"/><rect x="6" y="272" width="8" height="12" fill="#fff"/></g>
  ${arr(4,i=>`<circle class="drip" cx="${-60+i*38}" cy="296" r="4" fill="#bfe8ff" style="animation-delay:${i*.35}s"/>`)}`,
 drought:()=>`<ellipse cx="0" cy="326" rx="95" ry="15" fill="#3a2a14"/><ellipse class="fx shrinkx" cx="0" cy="326" rx="95" ry="15" fill="#2c78b0"/>
  <path d="M-125 345 L-85 322 L-105 300 M-40 345 L-15 318 L-45 298 M65 345 L40 320 L85 300 M110 345 L122 322" stroke="#2a1808" stroke-width="3" fill="none"/>
  <path d="M60 340 L62 250 M62 280 L90 255 M62 265 L40 240 M90 255 L100 240" stroke="#3a2a1a" stroke-width="6" fill="none" stroke-linecap="round"/>

 const el=$('typed');el.innerHTML='';$('enter').style.display='none';
 let i=0;
 (function tick(){
  if(i>=html.length){$('enter').style.display='inline-block';return}
  if(html[i]==='<'){i=html.indexOf('>',i)+1}else i++;
  el.innerHTML=html.slice(0,i);

 })();
}

}
function loadStage(){
 const st=STAGES[S.stage];S.seen=0;
 $('whoLabel').innerHTML=`<span class="mini">${avatar(S.g,'calm','head')}</span>${esc(S.name)}님의 시간 여행`;
 $('tempLabel').textContent=`지구 평균기온 +${st.t}℃`;$('tempLabel').style.color=COLORS[st.t-1];
 $('gauge').innerHTML=COLORS.map((c,i)=>`<span class="${i<st.t?'on':''}" style="${i<st.t?'background:'+c:''}">+${i+1}℃</span>`).join('');
 $('stTitle').textContent=st.title;$('stTitle').style.color=COLORS[st.t-1];
 $('stDesc').textContent=st.desc;
 $('mech').style.display=st.mech?'block':'none';
 document.body.style.background=BG[st.t-1];
 renderScene(st);
 $('walker').innerHTML=avatar(S.g,'calm');$('walker').style.left='5%';
 $('info').innerHTML=`<h3>🔎 주변을 둘러보세요</h3>장면 속 노란 <b style="color:var(--y)">!</b> 표시를 눌러 ${st.spots.length}곳을 모두 살펴보세요.`;
 say(`+${st.t}℃의 세계에 도착했어요. 주변을 둘러볼까요?`,'calm');
 const nx=$('next');nx.disabled=true;
 nx.textContent=S.stage<5?`다음 온도(+${st.t+1}℃)로 이동`:'체험 완료 리포트 보기';
}
function say(t,mood){
 $('bubble').textContent=t;
 $('av').innerHTML=avatar(S.g,mood,'head')+`<small>${esc(S.name)}</small>`;
 $('walker').innerHTML=avatar(S.g,mood);
}
function visit(i,g){
 const st=STAGES[S.stage],sp=st.spots[i],w=$('walker');
 if(w.classList.contains('go'))return;
 const n=st.spots.length;
 w.style.left=((i+1)*100/(n+1))+'%';w.classList.add('go');
 setTimeout(()=>{
  w.classList.remove('go');
  g.classList.add('act');
  $('info').innerHTML=`<h3>${sp.n}</h3><div class="chips">${sp.facts.map(f=>`<span>${f}</span>`).join('')}</div>`;
  say(sp.say.replace('__NAME__',S.name),sp.m);
  if(!g.dataset.done){g.dataset.done=1;S.seen++}
  if(S.seen>=n){
   $('next').disabled=false;
   if(st.end)setTimeout(()=>say(st.end,'sad'),4000);
  }
 },1100);
}
$('next').onclick=()=>{if(S.stage<5){S.stage++;loadStage();window.scrollTo(0,0)}else buildReport()};

/* step4 */
function buildReport(){
 document.body.style.background='#0a0a0a';show('s4');
 $('cav').innerHTML=avatar(S.g,'worry');
 $('ctitle').textContent=`${S.name}님이 마주한 +1℃부터 +6℃까지의 미래`;
 $('tl').innerHTML=SUM.map((s,i)=>`<div><b style="color:${COLORS[i]}">+${i+1}℃</b>${s}</div>`).join('');
 $('pledges').innerHTML='';
 PLEDGES.forEach(p=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{S.pledge=p;$('pin').value='';mark(b)};$('pledges').appendChild(b)});
}
function mark(b){document.querySelectorAll('.pledges button').forEach(x=>x.classList.remove('sel'));if(b)b.classList.add('sel');$('pl').textContent=S.pledge?`"${S.pledge}"`:''}
$('pin').oninput=e=>{S.pledge=e.target.value.trim();mark(null)};
function shareText(){
 return `🌡️ ${S.name}님이 지구 +1℃부터 +6℃까지의 미래를 체험했습니다.\n탄소 감축이 이뤄지지 않는다면 우리는 식량 위기, 해수면 상승, 거주지 상실, 그리고 멸종 가능성까지 마주하게 됩니다.\n${S.pledge?'제 다짐: '+S.pledge+'\n':''}(《최종 경고: 6도의 멸종》 기반 가상 체험)\n지구가 1℃씩 오르면 우리는 무엇을 마주할까요?\n${location.href}`;
}
$('share').onclick=async()=>{
 if(navigator.share){try{await navigator.share({title:'지구가 1℃씩 오르면?',text:shareText(),url:location.href})}catch(e){}}
 else copyTxt();
};
$('copy').onclick=copyTxt;
function copyTxt(){
 const t=shareText();
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{
  const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();
 }).finally(()=>toast('✅ 복사되었습니다! 붙여넣어 공유하세요'));
}
$('save').onclick=()=>{
 const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const img=new Image();
 img.onload=()=>{
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a140a');g.addColorStop(1,'#2a0505');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#2eff2e';x.lineWidth=6;x.strokeRect(30,30,W-60,H-60);
  x.textAlign='center';x.fillStyle='#2eff2e';x.font='bold 30px sans-serif';x.fillText('CERTIFICATE OF WITNESS',W/2,110);
  x.drawImage(img,W/2-80,130,160,200);
  x.fillStyle='#fff';x.font='bold 50px sans-serif';x.fillText(`${S.name}님이 마주한`,W/2,400);x.fillText('+1℃부터 +6℃까지의 미래',W/2,465);
  x.textAlign='left';
  SUM.forEach((s,i)=>{x.fillStyle=COLORS[i];x.font='bold 36px sans-serif';x.fillText(`+${i+1}℃`,90,560+i*92);x.fillStyle='#ddd';x.font='32px sans-serif';x.fillText(s,230,560+i*92)});
  x.textAlign='center';x.fillStyle='#ffd600';x.font='bold 38px sans-serif';
  x.fillText(S.pledge?`나의 다짐: ${S.pledge}`:'오늘부터 시작하는 작은 실천',W/2,1200);
  x.fillStyle='#888';x.font='24px sans-serif';
  x.fillText('탄소 감축이 이뤄지지 않았을 때를 가정한 가상 체험',W/2,1255);x.fillText('《최종 경고: 6도의 멸종》 기반',W/2,1290);
  const a=document.createElement('a');a.download=`climate_${S.name}.png`;a.href=c.toDataURL('image/png');a.click();toast('🖼️ 이미지가 저장되었습니다');
 };
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(avatar(S.g,'worry').replace('<svg ','<svg width="160" height="294" '));
};
$('again').onclick=()=>{S={g:'',name:'',stage:0,seen:0,pledge:''};$('name').value='';document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));chk();document.body.style.background='#0a0a0a';show('s1')};
</script>
</body>
</html>
